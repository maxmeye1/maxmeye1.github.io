<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max Meyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home">
        <header class="hero" id="hero">
            <div class="worldmap" id="worldmap">
                <h1 class="map-title" id="map-title">Max Meyer</h1>
                <svg aria-hidden="true" focusable="false" preserveAspectRatio="none">
                    <path class="dots"/>
                    <path class="dots dots-mid"/>
                    <path class="dots dots-small"/>
                </svg>
                <!-- Pins come from places.js -->
            </div>
            <button class="scroll-cue" type="button" aria-label="Scroll down"></button>
        </header>

        <div class="below" id="below">
            <!-- About and Contact come from content/about.js -->
            <main class="bio">
                <section>
                    <p class="label">About</p>
                    <div id="about"></div>
                </section>

                <section>
                    <p class="label">Contact</p>
                    <ul class="contact" id="contact"></ul>
                </section>
            </main>

            <nav class="side-nav" aria-label="Site">
                <ul>
                    <li><a href="projects-page.html">Projects</a></li>
                    <li><a href="blog-index-page.html">Writing</a></li>
                    <li><a href="coursework-page.html">Coursework</a></li>
                    <li><a href="todo.html">To-do</a></li>
                </ul>
            </nav>
        </div>

        <footer class="site-foot">&copy; 2026 Max Meyer</footer>
    </div>

    <script src="render.js"></script>
    <script src="content/about.js"></script>
    <script src="content/places.js"></script>
    <script>
        document.getElementById('map-title').textContent = ABOUT.name;
        document.getElementById('about').innerHTML = markup(ABOUT.about);
        document.getElementById('contact').innerHTML = ABOUT.contact.map(function (c) {
            const external = /^https?:/.test(c.url);
            return '<li><a href="' + c.url + '"' + (external ? ' target="_blank" rel="noopener"' : '') + '>' + inlineMarkup(c.label) + '</a></li>';
        }).join('');
    </script>
    <script src="home.js"></script>
</body>
</html>
