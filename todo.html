<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Dos - Max Meyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The text comes from content/todo.js -->
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>

        <article>
            <header class="post-header">
                <h1 id="heading"></h1>
                <div class="post-meta" id="meta"></div>
            </header>
            <div class="post-content" id="body"></div>
            <footer class="post-footer">
                <a href="index.html">← Back to Home</a>
            </footer>
        </article>
    </div>

    <script src="render.js"></script>
    <script src="content/about.js"></script>
    <script src="content/todo.js"></script>
    <script>
        document.getElementById('heading').textContent = TODO.title;
        document.getElementById('meta').textContent = [TODO.date, ABOUT.name].filter(Boolean).join(' • ');
        document.getElementById('body').innerHTML = markup(TODO.text);
    </script>
</body>
</html>
