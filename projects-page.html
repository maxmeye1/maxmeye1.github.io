<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Max Meyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="field-page">
        <header class="field-head">
            <h1 class="field-title">Projects <span>Things I've built and am building</span></h1>
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects-page.html" aria-current="page">Projects</a></li>
                    <li><a href="blog-index-page.html">Writing</a></li>
                    <li><a href="coursework-page.html">Coursework</a></li>
                    <li><a href="todo.html">To-do</a></li>
                </ul>
            </nav>
        </header>

        <!-- The paisleys are built from content/projects.js -->
        <main class="field" id="field"></main>
    </div>

    <script src="render.js"></script>
    <script src="content/projects.js"></script>
    <script>
        (function () {
            const field = document.getElementById('field');
            PROJECTS.forEach(function (pr) {
                const el = document.createElement('article');
                el.className = 'paisley';
                const meta = [pr.status, pr.kind].filter(Boolean).join(' · ');
                el.innerHTML =
                    '<button class="paisley-name" type="button"></button>' +
                    '<div class="paisley-body">' +
                        (meta ? '<div class="kind">' + inlineMarkup(meta) + '</div>' : '') +
                        (pr.text ? markup(pr.text) : '') +
                        (pr.tags && pr.tags.length ? '<p class="tags">' + pr.tags.map(inlineMarkup).join(' · ') + '</p>' : '') +
                        (pr.links && pr.links.length ? '<div class="links">' + pr.links.map(function (l) {
                            return inlineMarkup('[' + l.label + '](' + l.url + ')');
                        }).join(' ') + '</div>' : '') +
                    '</div>';
                el.querySelector('.paisley-name').textContent = pr.name;
                field.appendChild(el);
            });
        })();
    </script>
    <script src="paisleys.js"></script>
</body>
</html>
